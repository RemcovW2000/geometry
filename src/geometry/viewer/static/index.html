<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>geometry viewer</title>
<style>
  :root {
    --bg: #14181d; --panel: #1c2229; --panel2: #232b34; --text: #d6dde4;
    --dim: #8b98a5; --accent: #64b5f6; --error: #ef6a6a; --border: #2c3641;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.45 -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); overflow: hidden; }
  #app { display: grid; grid-template-columns: 300px 1fr; grid-template-rows: 42px 1fr;
         height: 100vh; }
  #topbar { grid-column: 1 / 3; display: flex; align-items: center; gap: 10px;
            padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--border); }
  #topbar .title { font-weight: 600; }
  #topbar .script { color: var(--dim); font-family: ui-monospace, monospace; font-size: 12px;
                    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
  #topbar .spacer { flex: 1; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--border);
           border-radius: 6px; padding: 5px 14px; cursor: pointer; font-size: 13px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: #29517a; border-color: #3a6ea5; }
  #status { color: var(--dim); font-size: 12px; min-width: 130px; text-align: right; }
  #status.building { color: var(--accent); }
  #sidebar { display: flex; flex-direction: column; background: var(--panel);
             border-right: 1px solid var(--border); min-height: 0; }
  #tree { flex: 1; overflow: auto; padding: 6px 0; }
  #inspector { border-top: 1px solid var(--border); padding: 10px 12px; max-height: 32vh;
               overflow: auto; }
  #inspector h3 { margin: 0 0 6px; font-size: 12px; color: var(--dim); font-weight: 600;
                  text-transform: uppercase; letter-spacing: .05em; }
  #inspector .path { color: var(--accent); font-size: 12px; word-break: break-all; }
  #inspector table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  #inspector td { padding: 2px 4px; font-size: 12px; border-bottom: 1px solid var(--border); }
  #inspector td:first-child { color: var(--dim); }
  #viewport { position: relative; min-width: 0; min-height: 0; }
  #canvas { position: absolute; inset: 0; }
  .row { display: flex; align-items: center; gap: 4px; padding: 1px 8px 1px 0;
         cursor: pointer; white-space: nowrap; user-select: none; }
  .row:hover { background: var(--panel2); }
  .row.selected { background: #2b4257; }
  .caret { width: 16px; text-align: center; color: var(--dim); flex: none; font-size: 10px; }
  .eye { width: 18px; text-align: center; flex: none; opacity: .75; }
  .eye.off { opacity: .25; }
  .label { overflow: hidden; text-overflow: ellipsis; }
  .kind { color: var(--dim); font-size: 11px; margin-left: 6px; }
  #error { position: absolute; inset: auto 12px 12px 12px; max-height: 45%;
           overflow: auto; background: #2a1a1a; border: 1px solid var(--error);
           border-radius: 8px; padding: 10px 14px; display: none; z-index: 5; }
  #error pre { margin: 0; color: #f2b8b8; font-size: 12px; white-space: pre-wrap; }
  #hint { position: absolute; left: 12px; top: 10px; color: var(--dim); font-size: 12px;
          pointer-events: none; z-index: 4; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span class="title">geometry viewer</span>
    <span class="script" id="script-name"></span>
    <span class="spacer"></span>
    <span id="status">idle</span>
    <button id="fit">Fit view</button>
    <button id="rebuild" class="primary">Rebuild</button>
  </div>
  <div id="sidebar">
    <div id="tree"></div>
    <div id="inspector"><h3>Inspector</h3><div class="path" id="insp-path">nothing selected</div>
      <table id="insp-table"></table></div>
  </div>
  <div id="viewport">
    <div id="canvas"></div>
    <div id="hint">left-drag rotate · right-drag pan · scroll zoom · click picks</div>
    <div id="error"><pre id="error-text"></pre></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- three.js scaffolding -------------------------------------------
const container = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14181d);
const camera = new THREE.PerspectiveCamera(50, 1, 0.001, 1e6);
camera.position.set(3, 3, 2);
camera.up.set(0, 0, 1);                       // engineering convention: z up
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xdfe8f0, 0x3a4450, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(4, 3, 6);
scene.add(sun);
const sun2 = new THREE.DirectionalLight(0x88aacc, 0.4); sun2.position.set(-4, -2, -3);
scene.add(sun2);
const grid = new THREE.GridHelper(10, 20, 0x33404d, 0x222a33);
grid.rotation.x = Math.PI / 2;                // into the x-y plane (z up)
scene.add(grid);
const axes = new THREE.AxesHelper(1.2); scene.add(axes);

const rootGroup = new THREE.Group(); scene.add(rootGroup);

function resize() {
  const w = container.clientWidth, h = container.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(container); resize();
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();

// ---------- scene graph from JSON -------------------------------------------
const nodesById = new Map();   // id -> {node, group, rows, objects}
let selectedId = null;

function makeGeometry(geom) {
  const positions = new Float32Array(geom.positions);
  if (geom.kind === 'mesh') {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    g.setIndex(Array.from(geom.indices));
    g.computeVertexNormals();
    const m = new THREE.MeshStandardMaterial({
      color: geom.color || '#8fa8bf', metalness: 0.05, roughness: 0.72,
      side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
    });
    return new THREE.Mesh(g, m);
  }
  if (geom.kind === 'lines') {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    g.setIndex(Array.from(geom.segments));
    return new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: geom.color || '#e8b34b' }));
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({
    color: geom.color || '#e06666', size: 6, sizeAttenuation: false }));
}

function buildGroups(node, parentGroup) {
  const group = new THREE.Group();
  group.name = node.id;
  parentGroup.add(group);
  const objects = [];
  for (const geom of node.geoms || []) {
    const obj = makeGeometry(geom);
    obj.userData.nodeId = node.id;
    obj.userData.baseColor = obj.material.color.getHex();
    group.add(obj); objects.push(obj);
  }
  nodesById.set(node.id, { node, group, objects, rowEl: null, visible: true });
  for (const child of node.children || []) buildGroups(child, group);
}

// ---------- object tree ------------------------------------------------------
const treeEl = document.getElementById('tree');

function buildTree(node, container, depth) {
  const entry = nodesById.get(node.id);
  const row = document.createElement('div');
  row.className = 'row'; row.style.paddingLeft = `${depth * 14}px`;
  const caret = document.createElement('span'); caret.className = 'caret';
  caret.textContent = (node.children && node.children.length) ? '▸' : '';
  const eye = document.createElement('span'); eye.className = 'eye'; eye.textContent = '👁';
  const label = document.createElement('span'); label.className = 'label'; label.textContent = node.label;
  const kind = document.createElement('span'); kind.className = 'kind'; kind.textContent = node.kind;
  row.append(caret, eye, label, kind);
  container.appendChild(row);
  entry.rowEl = row;

  const childBox = document.createElement('div');
  childBox.style.display = 'none';
  container.appendChild(childBox);
  let built = false;
  const toggleOpen = () => {
    if (!node.children || !node.children.length) return;
    if (!built) { for (const c of node.children) buildTree(c, childBox, depth + 1); built = true; }
    const open = childBox.style.display === 'none';
    childBox.style.display = open ? '' : 'none';
    caret.textContent = open ? '▾' : '▸';
  };
  caret.addEventListener('click', (e) => { e.stopPropagation(); toggleOpen(); });
  row.addEventListener('dblclick', () => { toggleOpen(); fitTo(entry.group); });
  eye.addEventListener('click', (e) => {
    e.stopPropagation();
    entry.visible = !entry.visible;
    entry.group.visible = entry.visible;
    eye.classList.toggle('off', !entry.visible);
  });
  row.addEventListener('click', () => select(node.id));
}

function select(id) {
  if (selectedId && nodesById.has(selectedId)) {
    nodesById.get(selectedId).rowEl?.classList.remove('selected');
    setHighlight(nodesById.get(selectedId).group, false);
  }
  selectedId = id;
  const entry = nodesById.get(id);
  if (!entry) return;
  entry.rowEl?.classList.add('selected');
  entry.rowEl?.scrollIntoView({ block: 'nearest' });
  setHighlight(entry.group, true);
  showInspector(entry.node);
}

function setHighlight(group, on) {
  group.traverse((obj) => {
    if (obj.material && obj.userData.baseColor !== undefined) {
      obj.material.color.setHex(on ? 0x64b5f6 : obj.userData.baseColor);
      if (obj.material.emissive) obj.material.emissive.setHex(on ? 0x1a4d80 : 0x000000);
    }
  });
}

function showInspector(node) {
  const parts = [];
  let cursor = sceneDoc.root;
  const ids = node.id.split('/');
  let acc = ids[0]; parts.push(cursor.label);
  for (let i = 1; i < ids.length; i++) {
    acc += '/' + ids[i];
    cursor = cursor.children[Number(ids[i])];
    parts.push(cursor.label);
  }
  document.getElementById('insp-path').textContent = parts.join(' ▸ ');
  const table = document.getElementById('insp-table');
  table.innerHTML = '';
  for (const [key, value] of Object.entries(node.meta || {})) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${key}</td><td>${value}</td>`;
    table.appendChild(tr);
  }
}

// ---------- picking ----------------------------------------------------------
const raycaster = new THREE.Raycaster();
raycaster.params.Line.threshold = 0.02;
raycaster.params.Points.threshold = 0.03;
renderer.domElement.addEventListener('click', (event) => {
  const rect = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    ((event.clientX - rect.left) / rect.width) * 2 - 1,
    -((event.clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(rootGroup.children, true)
    .filter(h => h.object.visible && h.object.userData.nodeId);
  if (hits.length) {
    openPathTo(hits[0].object.userData.nodeId);
    select(hits[0].object.userData.nodeId);
  }
});

function openPathTo(id) {   // expand tree rows down to id so selection is visible
  const ids = id.split('/');
  let acc = ids[0];
  for (let i = 1; i <= ids.length; i++) {
    const entry = nodesById.get(acc);
    if (entry?.rowEl) {
      const caret = entry.rowEl.querySelector('.caret');
      const box = entry.rowEl.nextSibling;
      if (caret?.textContent === '▸') caret.click();
      if (box && box.style) box.style.display = '';
    }
    if (i < ids.length) acc += '/' + ids[i];
  }
}

// ---------- fit view ---------------------------------------------------------
function fitTo(object) {
  const box = new THREE.Box3().setFromObject(object);
  if (box.isEmpty()) return;
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3()).length() || 1;
  const dir = camera.position.clone().sub(controls.target).normalize();
  controls.target.copy(center);
  camera.position.copy(center.clone().add(dir.multiplyScalar(size * 1.2)));
  camera.near = size / 1000; camera.far = size * 100;
  camera.updateProjectionMatrix();
  const scale = Math.pow(10, Math.round(Math.log10(size)));
  grid.scale.setScalar(scale / 10);
  axes.scale.setScalar(size / 8);
}
document.getElementById('fit').addEventListener('click', () => fitTo(rootGroup));

// ---------- loading / polling -----------------------------------------------
let sceneDoc = null;
let knownVersion = -1;
const statusEl = document.getElementById('status');

async function loadScene() {
  const response = await fetch('/scene');
  const doc = await response.json();
  knownVersion = doc.version;
  sceneDoc = doc;
  document.getElementById('script-name').textContent = doc.script || '';
  const errorBox = document.getElementById('error');
  if (doc.error) {
    document.getElementById('error-text').textContent = doc.error;
    errorBox.style.display = 'block';
    if (!doc.root) return;      // keep old geometry visible? no root -> nothing new
  } else {
    errorBox.style.display = 'none';
  }
  if (!doc.root) return;

  rootGroup.clear(); nodesById.clear(); selectedId = null;
  treeEl.innerHTML = '';
  buildGroups(doc.root, rootGroup);
  buildTree(doc.root, treeEl, 0);
  // open the first level by default
  nodesById.get('0')?.rowEl?.querySelector('.caret')?.click();
  fitTo(rootGroup);
  statusEl.textContent = doc.elapsed !== undefined ? `built in ${doc.elapsed}s` : 'loaded';
}

async function poll() {
  try {
    const response = await fetch('/status');
    const status = await response.json();
    statusEl.classList.toggle('building', status.building);
    if (status.building) statusEl.textContent = 'building…';
    if (!status.building && status.version !== knownVersion) await loadScene();
  } catch { statusEl.textContent = 'server gone'; }
  setTimeout(poll, 700);
}

document.getElementById('rebuild').addEventListener('click', async () => {
  statusEl.textContent = 'building…'; statusEl.classList.add('building');
  await fetch('/rebuild', { method: 'POST' });
});

poll();
</script>
</body>
</html>
